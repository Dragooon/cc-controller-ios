name: UI gate

# The UI journeys on the iPhone Duo, folded and unfolded, in one run. Each journey sets its own
# posture. The job checks out the private controller (read-only deploy key) for the fixture daemon.
# Started by hand it runs the core tier, required before merging; the schedule runs the nightly tier.
# Real-smoke still needs the real daemon on the Mac and is not part of this gate.

on:
  # About 35 runner minutes a night. GitHub only fires this from the default branch.
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Which journeys to run when tests is empty (core or nightly)
        default: core
      shards:
        description: Simulators run in parallel on each runner (3 vCPUs, so 1 is fastest)
        default: "1"
      controller_ref:
        description: Controller branch, tag or SHA for the fixture daemon
        default: main
      tests:
        description: Only these flows, space-separated Class or Class/method; empty runs the tier
        default: ""
      device:
        description: Simulator to run on
        default: iPhone Duo
      hinge:
        description: Hinge angle for tests outside the journeys, such as Motion (180 opens the Duo; empty is folded)
        default: ""
      motion:
        description: Instead of flows, record these motion scenarios on the Duo with video (e.g. "S1,S2")
        default: ""
      engine:
        description: Transcript engine for the flows that honour it (empty = collection, or "legacy")
        default: ""

permissions:
  contents: read

concurrency:
  group: ui-gate-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tier }}-${{ inputs.tests }}-${{ inputs.device }}-${{ inputs.engine }}-${{ inputs.motion }}-${{ inputs.hinge }}
  cancel-in-progress: true

jobs:
  flows:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TIER: ${{ github.event_name == 'schedule' && 'nightly' || inputs.tier || 'core' }}
      MOTION: ${{ inputs.motion }}
      TEST_RUNNER_HINGE_ANGLE: ${{ inputs.hinge }}
      TESTS: ${{ inputs.tests }}
      DEVICE: ${{ inputs.device || 'iPhone Duo' }}
      TEST_RUNNER_CC_TRANSCRIPT_ENGINE: ${{ inputs.engine }}
      CC_CONTROLLER_ROOT: ${{ github.workspace }}/cc-controller
      CC_EVIDENCE_DIR: ${{ github.workspace }}/evidence
      # The runners are 2-3x slower than the Mac; timed fixture scripts stretch by this much.
      CC_FLOW_TIME_SCALE: 3
    steps:
      - uses: actions/checkout@v7
        with:
          path: cc-controller-ios

      - uses: actions/checkout@v7
        with:
          repository: Dragooon/cc-controller
          ref: ${{ inputs.controller_ref || 'main' }}
          ssh-key: ${{ secrets.CC_CONTROLLER_DEPLOY_KEY }}
          path: cc-controller

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install the controller's dependencies
        working-directory: cc-controller
        run: npm ci

      - name: Run the journeys
        working-directory: cc-controller-ios
        run: |
          if [[ -n "$MOTION" ]]; then
            bash scripts/ios.sh motion --scenario "$MOTION" --engine collection --device duo --video --out "$CC_EVIDENCE_DIR/motion"
            exit
          fi
          started=$SECONDS
          filters=()
          for test in $TESTS; do filters+=(--test "$test"); done
          if [[ -z "$TESTS" ]]; then filters+=(--tier "$TIER"); fi
          bash scripts/ios.sh flows --device "$DEVICE" --shards "${{ inputs.shards || '1' }}" "${filters[@]}"
          echo "flows wall-clock=$((SECONDS - started))s"

      # A test that passes on its rerun still leaves its first failure in here.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flows-evidence
          path: evidence
          retention-days: 3
          if-no-files-found: ignore
