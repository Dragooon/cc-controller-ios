name: UI gate

# The full UI flow suite, split across parallel runners. Each job checks out the private
# controller (read-only deploy key) for the fixture daemon and runs one slice of the flows.
# Real-smoke still needs the real daemon on the Mac and is not part of this gate.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Simulators run in parallel on each runner (3 vCPUs, so 1 is fastest)
        default: "1"
      controller_ref:
        description: Controller branch, tag or SHA for the fixture daemon
        default: main
      tests:
        description: Only these flows, space-separated Class or Class/method (one runner); empty runs the suite
        default: ""
      device:
        description: Run on this simulator instead (e.g. "iPhone Duo") and keep its screenshots
        default: ""
      motion:
        description: Instead of flows, record these motion scenarios on the Duo with video (e.g. "S1,S2")
        default: ""
      engine:
        description: Transcript engine for the flows that honour it (empty = collection, or "legacy")
        default: ""

permissions:
  contents: read

concurrency:
  group: ui-gate-${{ github.ref }}-${{ inputs.tests }}-${{ inputs.device }}-${{ inputs.engine }}-${{ inputs.motion }}
  cancel-in-progress: true

jobs:
  flows:
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON((inputs.tests || inputs.motion) && '[0]' || '[0, 1, 2, 3, 4]') }}
    env:
      SLICES: ${{ (inputs.tests || inputs.motion) && 1 || 5 }}
      MOTION: ${{ inputs.motion }}
      TESTS: ${{ inputs.tests }}
      DEVICE: ${{ inputs.device }}
      TEST_RUNNER_CC_TRANSCRIPT_ENGINE: ${{ inputs.engine }}
      CC_CONTROLLER_ROOT: ${{ github.workspace }}/cc-controller
      CC_EVIDENCE_DIR: ${{ github.workspace }}/evidence
      # The runners are 2-3x slower than the Mac; timed fixture scripts stretch by this much.
      CC_FLOW_TIME_SCALE: 3
    steps:
      - uses: actions/checkout@v7
        with:
          path: cc-controller-ios

      - uses: actions/checkout@v7
        with:
          repository: Dragooon/cc-controller
          ref: ${{ inputs.controller_ref || 'main' }}
          ssh-key: ${{ secrets.CC_CONTROLLER_DEPLOY_KEY }}
          path: cc-controller

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install the controller's dependencies
        working-directory: cc-controller
        run: npm ci

      - name: Run flows slice ${{ matrix.slice }}
        working-directory: cc-controller-ios
        run: |
          if [[ -n "$MOTION" ]]; then
            bash scripts/ios.sh motion --scenario "$MOTION" --engine collection --device duo --video --out "$CC_EVIDENCE_DIR/motion"
            exit
          fi
          started=$SECONDS
          filters=()
          for test in $TESTS; do filters+=(--test "$test"); done
          if [[ -n "$DEVICE" ]]; then filters+=(--device "$DEVICE"); fi
          bash scripts/ios.sh flows --slice "${{ matrix.slice }}/$SLICES" --shards "${{ inputs.shards || '1' }}" "${filters[@]}"
          echo "slice ${{ matrix.slice }} wall-clock=$((SECONDS - started))s"

      # A test that passes on its rerun still leaves its first failure in here.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flows-evidence-slice-${{ matrix.slice }}
          path: evidence
          retention-days: 3
          if-no-files-found: ignore
