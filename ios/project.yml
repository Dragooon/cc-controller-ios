name: CCController
options:
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
  defaultConfig: Debug
packages:
  CCKit:
    path: CCKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CC_RELAY_ENDPOINTS: "https://192.0.2.10:47833 https://100.64.0.10:47833"
targets:
  CCController:
    type: application
    platform: iOS
    sources:
      - Sources/CCController
      - Resources
    resources:
      - Sources/CCController/Mocks/Data
      - Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: CCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cc-controller
        PRODUCT_NAME: cc-controller
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "MockBottomStackData.swift MockData.swift MockGate.swift SessionsMocks.swift ApprovalMocks.swift BottomStackMocks.swift SessionMocks.swift SheetMocks.swift WorkingBarMocks.swift sessions.json judge-alignment.png rollout.png"
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.example.cc-controller
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleDisplayName: Code
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Code connects to the relay on your home network to reach your Mac.
        CCRelayEndpoints: "$(CC_RELAY_ENDPOINTS)"
        NSFaceIDUsageDescription: Unlock Code
        NSCameraUsageDescription: Take a photo to send to a session.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - CCControllerUITests
      environmentVariables:
        TEST_RUNNER_SERVER_URL: "$(TEST_RUNNER_SERVER_URL)"
        TEST_RUNNER_BEARER: "$(TEST_RUNNER_BEARER)"
        TEST_RUNNER_SECOND_FIXTURE_BEARER: "$(TEST_RUNNER_SECOND_FIXTURE_BEARER)"
        TEST_RUNNER_ONLY: "$(TEST_RUNNER_ONLY)"
        TEST_RUNNER_MOCKS: "$(TEST_RUNNER_MOCKS)"
        TEST_RUNNER_FIXTURE_CONTROL_URL: "$(TEST_RUNNER_FIXTURE_CONTROL_URL)"
        TEST_RUNNER_COLOR_SCHEME: "$(TEST_RUNNER_COLOR_SCHEME)"
        TEST_RUNNER_REAL_SMOKE: "$(TEST_RUNNER_REAL_SMOKE)"
        TEST_RUNNER_REAL_SESSIONS: "$(TEST_RUNNER_REAL_SESSIONS)"
        TEST_RUNNER_REAL_SMOKE_OUTPUT_DIR: "$(TEST_RUNNER_REAL_SMOKE_OUTPUT_DIR)"
        TEST_RUNNER_MOTION_TRACE: "$(TEST_RUNNER_MOTION_TRACE)"
        TEST_RUNNER_MOTION_SCENARIO: "$(TEST_RUNNER_MOTION_SCENARIO)"
        TEST_RUNNER_MOTION_ORIENTATION: "$(TEST_RUNNER_MOTION_ORIENTATION)"
        TEST_RUNNER_CC_TRANSCRIPT_ENGINE: "$(TEST_RUNNER_CC_TRANSCRIPT_ENGINE)"
        CCMotionBuildSHA: "$(CCMotionBuildSHA)"
        CCMotionDevice: "$(CCMotionDevice)"
  CCControllerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CCController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cc-controller.uitests
        TEST_TARGET_NAME: CCController
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
