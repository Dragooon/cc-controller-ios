name: CCController
options:
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
  defaultConfig: Debug
packages:
  CCKit:
    path: CCKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
targets:
  CCController:
    type: application
    platform: iOS
    sources:
      - Sources/CCController
      - Resources
    resources:
      - Sources/CCController/Mocks/Data
    dependencies:
      - package: CCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cc-controller
        PRODUCT_NAME: cc-controller
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "MockBottomStackData.swift MockData.swift MockGate.swift SessionsMocks.swift ApprovalMocks.swift BottomStackMocks.swift SessionMocks.swift SheetMocks.swift sessions.json judge-alignment.png rollout.png"
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.example.cc-controller
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleDisplayName: cc-controller
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Unlock cc-controller
        NSCameraUsageDescription: Take a photo to send to a session.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - CCControllerUITests
      environmentVariables:
        TEST_RUNNER_SERVER_URL: "$(TEST_RUNNER_SERVER_URL)"
        TEST_RUNNER_BEARER: "$(TEST_RUNNER_BEARER)"
        TEST_RUNNER_ONLY: "$(TEST_RUNNER_ONLY)"
        TEST_RUNNER_MOCKS: "$(TEST_RUNNER_MOCKS)"
  CCControllerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CCController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cc-controller.uitests
        TEST_TARGET_NAME: CCController
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
